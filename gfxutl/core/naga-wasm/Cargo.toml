[package]
name = "gfxutl-naga-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
naga = { version = "30.0.1", default-features = false, features = ["glsl-in", "wgsl-in", "wgsl-out"] }
wasm-bindgen = "=0.2.105"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
